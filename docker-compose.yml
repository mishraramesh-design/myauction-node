services:
  # Backend API Service
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: auction-backend:latest
    container_name: reverse_auction_backend
    restart: always
    environment:
      NODE_ENV: production
      PORT: 8001
      DATABASE_URL: postgresql://appuser:apppassword@93.127.194.188:5432/appdb
      DB_HOST: 93.127.194.188
      DB_PORT: 5432
      DB_NAME: appdb
      DB_USER: appuser
      DB_PASSWORD: apppassword
      JWT_SECRET: ${JWT_SECRET:-reverse-auction-jwt-secret-change-this-abc123xyz}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-32-char-encryption-key-change-1}
      MAX_ITEMS_PER_TENDER: ${MAX_ITEMS_PER_TENDER:-2}
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
    ports:
      - "8001:8001"
    networks:
      - auction_network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8001/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    volumes:
      - ./logs:/app/logs

  # Frontend Service
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        REACT_APP_BACKEND_URL: ${REACT_APP_BACKEND_URL:-http://localhost:8001}
    image: auction-frontend:latest
    container_name: reverse_auction_frontend
    restart: always
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - auction_network
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro

networks:
  auction_network:
    driver: bridge
