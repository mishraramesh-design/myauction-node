version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: reverse_auction_db
    restart: always
    environment:
      POSTGRES_DB: ${DB_NAME:-auction_db}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-your_secure_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    ports:
      - "5432:5432"
    networks:
      - auction_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend API
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: reverse_auction_backend
    restart: always
    environment:
      NODE_ENV: production
      PORT: 8001
      DATABASE_URL: postgresql://${DB_USER:-postgres}:${DB_PASSWORD:-your_secure_password}@postgres:5432/${DB_NAME:-auction_db}
      JWT_SECRET: ${JWT_SECRET:-change-this-secret-key-in-production}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-change-this-32-char-key-prod}
      MAX_ITEMS_PER_TENDER: ${MAX_ITEMS_PER_TENDER:-2}
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
    ports:
      - "8001:8001"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - auction_network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8001/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Frontend
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: reverse_auction_frontend
    restart: always
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - backend
    networks:
      - auction_network
    environment:
      REACT_APP_BACKEND_URL: ${BACKEND_URL:-http://localhost:8001}

volumes:
  postgres_data:
    driver: local

networks:
  auction_network:
    driver: bridge
